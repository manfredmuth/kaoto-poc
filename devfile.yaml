schemaVersion: 2.2.2
metadata:
  name: devspace-developer1
attributes:
  vscode:
    extensions:
      - redhat.vscode-kaoto   # Install Kaoto GUI extension
components:
  - name: tools
    container:
      image: quay.io/devspaces/ide:next   # base IDE image (includes VS Code/Theia)
      memoryLimit: 2Gi
projects:
  - name: sample-camel
    source:
      type: git
      location: "https://github.com/manfredmuth/kaoto-poc.git"
commands:
  - id: open-kaoto-route
    exec:
      component: tools
      commandLine: "code /projects/sample-camel/routes/simple.camel.yaml"
      workingDir: /projects
      group:
        kind: build
        isDefault: true