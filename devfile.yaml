schemaVersion: 2.2.2
metadata:
  name: devspace-developer1
components:
  - name: tools
    container:
      image: quay.io/devspaces/udi-rhel9:latest
      memoryLimit: 4Gi
projects:
  - name: sample-camel
    git:
      remotes:
        origin: "https://github.com/manfredmuth/kaoto-poc.git"
commands:
  - id: install-jbang
    exec:
      component: tools
      workingDir: /projects
      commandLine: |
        set -eu
        if ! command -v jbang >/dev/null 2>&1; then
          curl -Ls https://sh.jbang.dev | bash -s - app setup
        fi
        export PATH="${HOME}/.jbang/bin:${PATH}"
        grep -q '.jbang/bin' "${HOME}/.bashrc" || echo 'export PATH="${HOME}/.jbang/bin:${PATH}"' >> "${HOME}/.bashrc"
        jbang trust add https://github.com/apache/camel
        jbang app install camel@apache/camel
        jbang version
        camel version
  - id: post-start-install-extensions
    exec:
      component: vscode
      workingDir: /projects
      commandLine: |
        for i in $(seq 1 30); do
          code --install-extension redhat.apache-camel-extension-pack &&
          code --install-extension redhat.vscode-kaoto &&
          exit 0
          sleep 5
        done
        exit 1
events:
  postStart:
    - install-jbang
    - post-start-install-extensions
